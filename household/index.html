<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>우리집 가계부</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0f172a; -webkit-tap-highlight-color: transparent; }
  .bar { transition: width .6s ease; }
</style>
</head>
<body class="text-slate-100 min-h-screen">
<div class="max-w-md mx-auto px-4 pb-10 pt-6">

  <header class="mb-5">
    <h1 class="text-2xl font-extrabold">🏠 우리집 가계부</h1>
    <p id="updated" class="text-xs text-slate-400 mt-1"></p>
  </header>

  <!-- 요약 카드: 수입 / 지출 / 차액 -->
  <div class="grid grid-cols-3 gap-2 mb-6">
    <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700">
      <p class="text-[11px] text-slate-400">월 수입</p>
      <p id="sum-income" class="text-lg font-extrabold text-emerald-400">-</p>
      <p id="sum-income-note" class="text-[10px] text-slate-500"></p>
    </div>
    <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700">
      <p class="text-[11px] text-slate-400">월 지출</p>
      <p id="sum-expense" class="text-lg font-extrabold text-red-400">-</p>
    </div>
    <div class="bg-slate-800 rounded-2xl p-3 border border-slate-700">
      <p class="text-[11px] text-slate-400">차액</p>
      <p id="sum-diff" class="text-lg font-extrabold">-</p>
    </div>
  </div>

  <!-- 섹션: 수입 -->
  <section class="mb-7">
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-base font-bold">💰 수입</h2>
      <span id="income-month" class="text-xs text-slate-400"></span>
    </div>
    <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden mb-2">
      <div class="px-4 py-3 bg-slate-900/60 flex items-baseline justify-between">
        <span class="text-sm text-slate-300">이 달 급여 합계</span>
        <span id="income-total" class="text-2xl font-extrabold text-emerald-400">-</span>
      </div>
      <ul id="income-list" class="divide-y divide-slate-700/60"></ul>
    </div>
    <p class="text-[11px] text-slate-500 px-1">입금될 때마다 실제 금액을 입력하세요. 입력한 금액은 이 기기에만 저장됩니다.</p>
  </section>

  <!-- 섹션: 고정 지출 -->
  <section class="mb-7">
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-base font-bold">📌 고정 지출</h2>
      <span id="fixed-count" class="text-xs text-slate-400"></span>
    </div>
    <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden">
      <div class="px-4 py-3 bg-slate-900/60 flex items-baseline justify-between">
        <span class="text-sm text-slate-300">월 합계</span>
        <span id="fixed-total" class="text-2xl font-extrabold text-red-400">-</span>
      </div>
      <ul id="fixed-list" class="divide-y divide-slate-700/60"></ul>
    </div>
  </section>

  <!-- 섹션: 카드별 -->
  <section class="mb-7">
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-base font-bold">💳 카드별</h2>
      <span class="text-[11px] text-slate-400"><span class="text-red-400">●</span> 사용액(지출) <span class="text-emerald-400 ml-1">●</span> 결제액</span>
    </div>
    <div id="cards-list" class="space-y-2"></div>
  </section>

  <!-- 섹션: Affirm -->
  <section class="mb-7">
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-base font-bold">📦 Affirm 할부</h2>
      <span id="affirm-total" class="text-xs text-slate-400"></span>
    </div>
    <div id="affirm-list" class="space-y-2"></div>
  </section>

  <!-- 섹션: 변동 지출 -->
  <section>
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-base font-bold">🧾 변동 지출 (영수증)</h2>
      <span id="var-total" class="text-xs text-slate-400"></span>
    </div>
    <ul id="receipt-list" class="space-y-2"></ul>
  </section>

  <footer class="mt-8 text-center text-[11px] text-slate-500">
    data.json만 고치면 자동 반영됩니다
  </footer>
</div>

<script>
const fmt = n => '$' + n.toLocaleString('en-CA', {minimumFractionDigits: 2, maximumFractionDigits: 2});

// --- 수입 렌더링: 격주 급여일 생성 + localStorage 실측 (data.json 없어도 동작) ---
const LS_INCOME_ACTUALS = 'household_income_actuals';
function getIncomeActuals() {
  try { return JSON.parse(localStorage.getItem(LS_INCOME_ACTUALS) || '{}'); } catch (e) { return {}; }
}
function renderIncome(d) {
  const FALLBACK = { label: 'Northwood 급여', freq: 'biweekly', first_pay: '2026-10-08', estimate: 1100, note: '격주 목요일, 보통 1,100 (변동)' };
  const cfg = (d && d.income && d.income[0]) || FALLBACK;
  const est = cfg.estimate || 1100;
  const KO_DAY = ['일', '월', '화', '수', '목', '금', '토'];
  const parseYMD = s => { const [y, m, dd] = s.split('-').map(Number); return new Date(y, m - 1, dd, 12); };
  const fmtYMD = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');

  // 2026-10-08부터 14일 간격, 앞으로 6개월치 급여일 생성
  const paydays = [];
  const horizon = new Date(); horizon.setMonth(horizon.getMonth() + 6);
  for (let dt = parseYMD(cfg.first_pay || '2026-10-08'); dt <= horizon; dt.setDate(dt.getDate() + 14)) {
    paydays.push(fmtYMD(dt));
  }
  const nowDt = new Date();
  const curYM = nowDt.getFullYear() + '-' + String(nowDt.getMonth() + 1).padStart(2, '0');
  const curPaydays = paydays.filter(p => p.slice(0, 7) === curYM);
  document.getElementById('income-month').textContent = nowDt.getFullYear() + '년 ' + (nowDt.getMonth() + 1) + '월';

  const actuals = getIncomeActuals();
  let sum = 0, hasEst = false;
  document.getElementById('income-list').innerHTML = curPaydays.length ? curPaydays.map(p => {
    const dt = parseYMD(p);
    const a = actuals[p];
    const isActual = a != null && !isNaN(a);
    const amt = isActual ? a : est;
    if (!isActual) hasEst = true;
    sum += amt;
    const dateLabel = (dt.getMonth() + 1) + '/' + dt.getDate() + ' (' + KO_DAY[dt.getDay()] + ')';
    return `
    <li class="px-4 py-2.5 flex items-center gap-3">
      <span class="w-[68px] shrink-0 text-center text-xs font-bold bg-slate-700 rounded-lg py-1">${dateLabel}</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm truncate">${cfg.label}</p>
        ${isActual
          ? '<span class="text-[10px] font-bold text-emerald-400 bg-emerald-900/50 rounded px-1.5 py-0.5">확정</span>'
          : '<span class="text-[10px] text-slate-400">~예정</span>'}
      </div>
      <span class="text-sm font-bold ${isActual ? 'text-emerald-300' : 'text-slate-400'} whitespace-nowrap">${fmt(amt)}</span>
      <button data-payday="${p}" data-amt="${isActual ? a : ''}" class="income-edit shrink-0 text-[11px] font-bold text-sky-300 bg-sky-900/50 rounded-lg px-2.5 py-1.5">${isActual ? '수정' : '입력'}</button>
    </li>`;
  }).join('') : '<li class="px-4 py-4 text-sm text-slate-500 text-center">이 달 급여일이 없어요</li>';

  document.getElementById('income-total').textContent = curPaydays.length ? (hasEst ? '~' : '') + fmt(sum) : '-';
  document.getElementById('sum-income').textContent = curPaydays.length ? (hasEst ? '~' : '') + fmt(sum) : '-';
  document.getElementById('sum-income-note').textContent = !curPaydays.length ? '' : (hasEst ? '추정 포함' : '전액 확정');

  document.querySelectorAll('.income-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.payday;
      const v = prompt(p + ' 실수령액을 입력하세요 (CAD)', btn.dataset.amt);
      if (v == null) return;
      const n = parseFloat(v.replace(/,/g, ''));
      if (isNaN(n) || n <= 0) { alert('올바른 금액을 입력하세요'); return; }
      const a2 = getIncomeActuals();
      a2[p] = Math.round(n * 100) / 100;
      localStorage.setItem(LS_INCOME_ACTUALS, JSON.stringify(a2));
      load();
    });
  });
  return { incomeMonthlyEst: curPaydays.length ? sum : 0, incomeHasEst: hasEst };
}

async function load() {
  let d = null;
  try {
    d = await (await fetch('./data.json')).json();
  } catch (e) { console.error('data.json load failed', e); }
  // 수입은 localStorage 기반이라 fetch 실패해도 렌더링
  const { incomeMonthlyEst, incomeHasEst } = renderIncome(d);
  if (!d) {
    document.body.insertAdjacentHTML('afterbegin',
      '<div class="max-w-md mx-auto p-6 text-center text-sm text-red-300">data.json을 불러오지 못했어요 (수입은 로컬 데이터로 표시됩니다)</div>');
    return;
  }
  document.getElementById('updated').textContent = '업데이트: ' + (d.meta?.updated || '');

  // --- 고정 지출 ---
  const monthly = d.fixed.filter(x => !x.freq).sort((a, b) => a.day - b.day);
  const biweekly = d.fixed.filter(x => x.freq === 'biweekly');
  const monthlySum = monthly.reduce((s, x) => s + x.amount, 0);
  const biweeklyMonthly = biweekly.reduce((s, x) => s + x.amount * 2, 0); // 월 2회 가정
  const fixedTotal = monthlySum + biweeklyMonthly;

  document.getElementById('fixed-total').textContent = fmt(fixedTotal);
  document.getElementById('fixed-count').textContent = monthly.length + biweekly.length + '건';

  const list = document.getElementById('fixed-list');
  list.innerHTML = monthly.map(x => `
    <li class="px-4 py-2.5 flex items-center gap-3">
      <span class="w-9 shrink-0 text-center text-xs font-bold bg-slate-700 rounded-lg py-1">${x.day}일</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm truncate">${x.label}</p>
        ${x.from ? `<p class="text-[11px] text-slate-400">${x.from}</p>` : ''}
      </div>
      <span class="text-sm font-bold text-red-300 whitespace-nowrap">${fmt(x.amount)}</span>
    </li>`).join('') + biweekly.map(x => `
    <li class="px-4 py-2.5 flex items-center gap-3 bg-violet-950/30">
      <span class="w-9 shrink-0 text-center text-[10px] font-bold bg-violet-700 rounded-lg py-1">격주</span>
      <div class="flex-1 min-w-0">
        <p class="text-sm truncate">${x.label}</p>
        <p class="text-[11px] text-slate-400">${x.from}${x.next ? ' · 다음 ' + x.next : ''}</p>
      </div>
      <span class="text-sm font-bold text-red-300 whitespace-nowrap">${fmt(x.amount)}</span>
    </li>`).join('');

  // --- 변동 지출 (영수증) ---
  const receipts = d.receipts || [];
  const vTotal = receipts.reduce((s, x) => s + x.amount, 0);
  document.getElementById('var-total').textContent = '합계 ' + fmt(vTotal);
  document.getElementById('receipt-list').innerHTML = receipts.length ? receipts.map(x => `
    <li class="bg-slate-800 rounded-2xl p-3.5 border border-slate-700">
      <div class="flex items-baseline justify-between mb-1">
        <p class="text-sm font-bold">${x.merchant}</p>
        <p class="text-sm font-extrabold text-red-300">${fmt(x.amount)}</p>
      </div>
      <p class="text-[11px] text-slate-400">${x.date}${x.items ? ' · ' + x.items : ''}${x.pay ? ' · ' + x.pay : ''}</p>
    </li>`).join('')
    : '<li class="text-sm text-slate-500 text-center py-4">아직 등록된 영수증이 없어요</li>';

  // --- 요약: 월 지출 / 차액 ---
  const expenseTotal = fixedTotal + vTotal;
  document.getElementById('sum-expense').textContent = fmt(expenseTotal);
  const diffEl = document.getElementById('sum-diff');
  if (incomeMonthlyEst) {
    const diff = incomeMonthlyEst - expenseTotal;
    diffEl.textContent = (diff >= 0 ? '+' : '') + fmt(diff).replace('$-', '-$');
    diffEl.className = 'text-lg font-extrabold ' + (diff >= 0 ? 'text-emerald-400' : 'text-red-400');
  } else {
    diffEl.textContent = '-';
    diffEl.className = 'text-lg font-extrabold text-slate-400';
  }

  // --- 카드별 ---
  const cards = d.cards || [];
  const holders = [...new Set(cards.map(c => c.holder))];
  const cardList = document.getElementById('cards-list');
  cardList.innerHTML = holders.map(h => {
    const hc = cards.filter(c => c.holder === h);
    const hPay = hc.reduce((s, c) => s + (c.payment || 0), 0);
    const rows = hc.map(c => {
      const pct = (c.used != null && c.limit) ? Math.min(100, Math.round(c.used / c.limit * 100)) : null;
      const usedHtml = c.used != null
        ? `<span class="text-sm font-bold text-red-300">${fmt(c.used)}</span>`
        : `<span class="text-[11px] text-amber-300">확인 필요</span>`;
      return `
      <div class="bg-slate-800 rounded-2xl p-3.5 border border-slate-700">
        <div class="flex items-baseline justify-between mb-1">
          <p class="text-sm font-bold">${c.name}</p>
          <p class="text-[11px] text-slate-400">한도 ${fmt(c.limit)}</p>
        </div>
        ${pct != null ? `
        <div class="h-2 bg-slate-700 rounded-full overflow-hidden mb-2">
          <div class="bar h-full bg-red-500 rounded-full" style="width:${pct}%"></div>
        </div>` : ''}
        <div class="flex items-center justify-between text-[11px]">
          <span class="text-slate-400"><span class="text-red-400">●</span> 사용액(지출) ${usedHtml}</span>
          <span class="text-slate-400"><span class="text-emerald-400">●</span> 결제액 <span class="text-sm font-bold text-emerald-300">${fmt(c.payment || 0)}</span></span>
        </div>
        ${c.note ? `<p class="text-[10px] text-amber-300/80 mt-1">${c.note}</p>` : ''}
      </div>`;
    }).join('');
    return `
    <div class="mb-1">
      <div class="flex items-baseline justify-between mb-2 px-1">
        <h3 class="text-sm font-bold text-slate-200">👤 ${h} <span class="text-[11px] font-normal text-slate-400">${hc.length}장</span></h3>
        <span class="text-[11px] text-slate-400">월 결제 합계 <span class="text-emerald-300 font-bold">${fmt(hPay)}</span></span>
      </div>
      <div class="space-y-2">${rows}</div>
    </div>`;
  }).join('');

  // --- Affirm ---
  const aTotal = d.affirm.reduce((s, x) => s + x.remaining, 0);
  document.getElementById('affirm-total').textContent = '총 잔액 ' + fmt(aTotal);
  document.getElementById('affirm-list').innerHTML = d.affirm.map(x => {
    const pct = Math.round(x.paid / x.total * 100);
    return `
    <div class="bg-slate-800 rounded-2xl p-3.5 border border-slate-700">
      <div class="flex items-baseline justify-between mb-1">
        <p class="text-sm font-bold">${x.merchant} ${x.autopay ? '<span class="text-[10px] font-normal text-emerald-400 ml-1">AutoPay</span>' : ''}</p>
        <p class="text-base font-extrabold text-violet-300">${fmt(x.remaining)} <span class="text-[11px] font-normal text-slate-400">남음</span></p>
      </div>
      <p class="text-[11px] text-slate-400 mb-1.5">${x.paid} of ${x.total} 회차</p>
      <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
        <div class="bar h-full bg-violet-500 rounded-full" style="width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');
}
load();
</script>
</body>
</html>
